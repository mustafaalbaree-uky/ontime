name: OnTime

options:
  bundleIdPrefix: com.mammer55
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Personal (free) Apple ID team for Mustafa Albaree. Automatic signing.
    DEVELOPMENT_TEAM: "34ZCK63GEC"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OnTime:
    type: application
    platform: iOS
    sources:
      - path: OnTime
      # Compiled into both the app and the widget extension.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.ontime
        PRODUCT_NAME: OnTime
        INFOPLIST_FILE: OnTime/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: OnTimeWidget
        embed: true

  OnTimeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OnTimeWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.ontime.widget
        PRODUCT_NAME: OnTimeWidget
        INFOPLIST_FILE: OnTimeWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  OnTimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OnTimeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mammer55.ontime.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OnTime

schemes:
  OnTime:
    build:
      targets:
        OnTime: all
        OnTimeWidget: all
        OnTimeTests: [test]
    test:
      config: Debug
      targets:
        - OnTimeTests
    run:
      config: Debug
